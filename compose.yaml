services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bluesky
      POSTGRES_USER: bluesky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluesky -d bluesky"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://bluesky:${POSTGRES_PASSWORD:-local-development-only}@db:5432/bluesky
      RAW_DIR: /app/data/raw
      METRICS_HOST: 0.0.0.0
      POST_RETENTION_HOURS: ${POST_RETENTION_HOURS:-6}
      RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-6}
      ANALYSIS_MAX_POSTS: ${ANALYSIS_MAX_POSTS:-1000000}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - raw-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  postgres-data:
  raw-data:
