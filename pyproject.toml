[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-early-warning"
version = "0.1.0"
description = "Reliable local Jetstream ingestion for an activity spike detector"
requires-python = ">=3.14"
dependencies = ["websockets==17.2", "fastapi==0.143.3", "uvicorn==0.54.0"]

[project.scripts]
bluesky-ingest = "bluesky_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
